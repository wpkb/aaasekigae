<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Seating App | 席替えアプリ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --container-bg: rgba(255, 255, 255, 0.85);
            --text-color: #2d3748;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #64748b;
            --accent: #f59e0b;
            --seat-bg: #ffffff;
            --seat-border: #cbd5e1;
            --board-bg: #1e293b;
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0f172a;
                --container-bg: rgba(30, 41, 59, 0.85);
                --text-color: #f8fafc;
                --border-color: #334155;
                --primary: #6366f1;
                --primary-hover: #4f46e5;
                --seat-bg: #1e293b;
                --seat-border: #475569;
                --board-bg: #0f172a;
                --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            }
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px;
            transition: background-color 0.3s;
            /* iOSでの引っ張りスクロール等は許可しつつ、特定の要素でのみ無効化するよう変更 */
        }
        
        .container { 
            max-width: 900px; margin: auto; padding: 30px; 
            background: var(--container-bg);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 20px; box-shadow: var(--glass-shadow); border: 1px solid rgba(255, 255, 255, 0.18);
        }

        h1 { text-align: center; font-size: 2rem; font-weight: 800; margin-bottom: 30px; background: linear-gradient(135deg, var(--primary), #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        textarea { 
            width: 100%; height: 120px; padding: 15px; box-sizing: border-box; 
            border: 1px solid var(--border-color); border-radius: 12px; font-size: 15px; 
            background: rgba(255,255,255,0.05); color: var(--text-color); resize: vertical;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); }

        .controls { display: flex; justify-content: center; gap: 15px; align-items: center; flex-wrap: wrap; margin: 25px 0; }
        .input-group { display: flex; align-items: center; gap: 8px; background: rgba(100,116,139,0.1); padding: 8px 15px; border-radius: 10px; }
        .input-group input { 
            width: 50px; padding: 8px; border: none; border-radius: 6px; 
            background: var(--bg-color); color: var(--text-color); font-weight: bold; text-align: center;
        }

        .btn { 
            padding: 10px 20px; font-size: 14px; font-weight: 600; color: white; 
            border: none; border-radius: 10px; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex; align-items: center; gap: 8px;
        }
        .btn:active { transform: scale(0.95); }
        .btn-main { background: var(--primary); font-size: 16px; padding: 12px 30px; border-radius: 30px; box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4); }
        .btn-main:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.5); }
        .btn-sub { background: var(--secondary); }
        .btn-sub:hover { background: #475569; }
        .btn-image { background: var(--accent); color: #fff; }

        #board-section { display: none; margin-top: 40px; }
        .board-container { padding: 30px; border-radius: 16px; background: var(--container-bg); border: 1px solid var(--border-color); }
        
        .board { 
            background: var(--board-bg); color: #fff; padding: 12px; border-radius: 8px; 
            margin: 0 auto 30px; font-weight: bold; letter-spacing: 4px; text-align: center;
            width: 60%; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.2);
        }
        
        .seating-grid { display: grid; gap: 12px; justify-content: center; position: relative; }
        .seat { 
            background: var(--seat-bg); border: 2px solid var(--seat-border); padding: 15px 5px; border-radius: 12px; 
            font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,0.05); color: var(--text-color);
            display: flex; align-items: center; justify-content: center; word-break: break-all;
            cursor: pointer; user-select: none; font-size: 14px; 
            transition: all 0.2s ease;
            /* iOS用の設定 */
            -webkit-touch-callout: none;
        }
        .seat:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); border-color: var(--primary); }
        .seat.drag-over { background: rgba(79, 70, 229, 0.1); border-color: var(--primary); border-style: dashed; transform: scale(1.05); }
        .seat.dragging { opacity: 0.5; transform: scale(0.95); z-index: 100; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .empty-seat { color: var(--secondary); background: rgba(100,116,139,0.05); border-style: dashed; }
        
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .instruction { font-size: 13px; color: var(--secondary); display: flex; flex-direction: column; gap: 5px; text-align: left; }
        
        /* 開発者クレジット */
        .developer-credit { 
            margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border-color); 
            display: flex; justify-content: center; align-items: center; gap: 20px; flex-wrap: wrap;
        }
        .dev-badge { font-size: 12px; color: var(--secondary); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .social-links { display: flex; gap: 15px; }
        .social-link { 
            display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text-color);
            padding: 8px 16px; border-radius: 20px; background: rgba(100,116,139,0.1); transition: 0.2s;
            font-size: 14px; font-weight: 500;
        }
        .social-link:hover { background: rgba(100,116,139,0.2); transform: translateY(-2px); }
        .social-link.x:hover { color: #000; background: #fff; border: 1px solid #ccc;}
        .social-link.youtube:hover { color: #ff0000; }
        
        @media (max-width: 600px) {
            .action-bar { flex-direction: column; align-items: stretch; }
            .board { width: 90%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Smart Seating App</h1>
        
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px;">
            <p style="font-weight: 600; margin: 0; font-size: 14px; color: var(--secondary);">メンバーリスト (改行区切り)</p>
            <div style="display: flex; gap: 8px;">
                <input type="file" id="fileInput" accept=".json" style="display: none;" onchange="loadData(event)">
                <button class="btn btn-sub" onclick="document.getElementById('fileInput').click()"><i class="fas fa-folder-open"></i> 読込</button>
                <button class="btn btn-sub" onclick="saveData()"><i class="fas fa-save"></i> 保存</button>
            </div>
        </div>
        
        <textarea id="namesInput" placeholder="山田太郎&#10;佐藤花子&#10;鈴木一郎"></textarea>
        
        <div class="controls">
            <div class="input-group">
                <i class="fas fa-arrows-alt-v" style="color: var(--secondary);"></i>
                <label>縦</label>
                <input type="number" id="rowsInput" value="5" min="1" max="15">
            </div>
            <div class="input-group">
                <i class="fas fa-arrows-alt-h" style="color: var(--secondary);"></i>
                <label>横</label>
                <input type="number" id="colsInput" value="6" min="1" max="15">
            </div>
            <button class="btn btn-main" onclick="shuffleSeats()"><i class="fas fa-random"></i> シャッフル</button>
        </div>

        <div id="board-section">
            <div class="action-bar">
                <div class="instruction">
                    <span><i class="fas fa-hand-pointer"></i> <b>タップ</b>: 名前の変更・追加・削除</span>
                    <span><i class="fas fa-hand-rock"></i> <b>ドラッグ</b>: 座席の入れ替え</span>
                </div>
                <button class="btn btn-image" onclick="downloadImage()"><i class="fas fa-camera"></i> 画像として書き出し</button>
            </div>
            
            <div id="capture-area" class="board-container">
                <div class="board">FRONT</div>
                <div id="seatingGrid" class="seating-grid"></div>
            </div>
        </div>

        <!-- 開発者クレジット -->
        <div class="developer-credit">
            <div class="dev-badge">Developed by</div>
            <div class="social-links">
                <a href="https://x.com/warp_Kirby_star" target="_blank" class="social-link x">
                    <i class="fa-brands fa-x-twitter"></i> @warp_Kirby_star
                </a>
                <a href="https://youtube.com/@warpstar-kirby" target="_blank" class="social-link youtube">
                    <i class="fab fa-youtube"></i> @warpstar-kirby
                </a>
            </div>
        </div>
    </div>

 <script>
        let currentSeats = [];
        let numCols = 6;
        let numRows = 5;

        // ドラッグ管理
        let dragStartIndex = null;
        let currentDragElement = null;
        let touchStartX = 0;
        let touchStartY = 0;
        let isMoving = false;
        let dragTimer = null;

        // 【バグ修正用】タッチ操作直後のマウスイベント誤発火を防ぐタイムスタンプ
        let lastTouchTime = 0;

        function shuffleSeats() {
            const namesText = document.getElementById('namesInput').value;
            numRows = parseInt(document.getElementById('rowsInput').value);
            numCols = parseInt(document.getElementById('colsInput').value);
            
            let names = namesText.split('\n').map(n => n.trim()).filter(n => n !== '');
            const totalSeats = numRows * numCols;
            
            while (names.length < totalSeats) { names.push("空席"); }
            names = names.slice(0, totalSeats);
            
            // Fisher-Yates シャッフル
            for (let i = names.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [names[i], names[j]] = [names[j], names[i]];
            }
            
            currentSeats = names;
            renderBoard();
        }

        function editSeat(index) {
            const currentName = currentSeats[index];
            const defaultText = currentName === "空席" ? "" : currentName;
            
            const newName = prompt("名前を変更 (空欄で空席になります)", defaultText);
            if (newName !== null) {
                const trimmed = newName.trim();
                currentSeats[index] = trimmed === "" ? "空席" : trimmed;
                renderBoard();
                syncTextarea();
            }
        }

        function syncTextarea() {
            const activeNames = currentSeats.filter(n => n !== "空席");
            document.getElementById('namesInput').value = activeNames.join('\n');
        }

        function renderBoard() {
            const grid = document.getElementById('seatingGrid');
            grid.style.gridTemplateColumns = `repeat(${numCols}, 1fr)`;
            grid.innerHTML = '';

            currentSeats.forEach((name, index) => {
                const seatDiv = document.createElement('div');
                seatDiv.className = `seat ${name === '空席' ? 'empty-seat' : ''}`;
                seatDiv.textContent = name;
                seatDiv.dataset.index = index;
                
                // === PC用イベント ===
                seatDiv.draggable = true;
                seatDiv.addEventListener('dragstart', (e) => {
                    dragStartIndex = index;
                    e.dataTransfer.setData('text/plain', index);
                    setTimeout(() => seatDiv.classList.add('dragging'), 0);
                });
                seatDiv.addEventListener('dragend', () => seatDiv.classList.remove('dragging'));
                seatDiv.addEventListener('dragover', (e) => { e.preventDefault(); seatDiv.classList.add('drag-over'); });
                seatDiv.addEventListener('dragleave', () => seatDiv.classList.remove('drag-over'));
                seatDiv.addEventListener('drop', handleDrop);
                
                // PCでのクリック（直前にタッチ操作があった場合はガードして無視する）
                let isPcDrag = false;
                seatDiv.addEventListener('mousedown', () => {
                    if (Date.now() - lastTouchTime < 500) return;
                    isPcDrag = false;
                });
                seatDiv.addEventListener('mousemove', () => {
                    isPcDrag = true;
                });
                seatDiv.addEventListener('mouseup', () => {
                    if (Date.now() - lastTouchTime < 500) return;
                    if(!isPcDrag) editSeat(index);
                });

                // === スマホ用イベント ===
                seatDiv.addEventListener('touchstart', handleTouchStart, { passive: false });
                seatDiv.addEventListener('touchmove', handleTouchMove, { passive: false });
                seatDiv.addEventListener('touchend', handleTouchEnd);

                grid.appendChild(seatDiv);
            });
            
            document.getElementById('board-section').style.display = 'block';
        }

        function swapSeats(sourceIndex, targetIndex) {
            if (sourceIndex !== null && targetIndex !== null && sourceIndex !== targetIndex) {
                const temp = currentSeats[sourceIndex];
                currentSeats[sourceIndex] = currentSeats[targetIndex];
                currentSeats[targetIndex] = temp;
                renderBoard();
            }
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            const sourceIndex = e.dataTransfer.getData('text/plain');
            swapSeats(sourceIndex, this.dataset.index);
        }

        // --- スマホ用タッチ処理 ---
        function handleTouchStart(e) {
            if (e.touches.length > 1) return;
            lastTouchTime = Date.now(); // タッチされた時間を記録
            
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            isMoving = false;
            
            currentDragElement = this;
            dragStartIndex = this.dataset.index;
            
            dragTimer = setTimeout(() => {
                if(!isMoving) {
                    this.classList.add('dragging');
                    if (navigator.vibrate) navigator.vibrate(50);
                }
            }, 200);
        }

        function handleTouchMove(e) {
            if (!currentDragElement) return;
            
            const touch = e.touches[0];
            const moveX = Math.abs(touch.clientX - touchStartX);
            const moveY = Math.abs(touch.clientY - touchStartY);
            
            if (moveX > 10 || moveY > 10) {
                isMoving = true;
                e.preventDefault(); 
                currentDragElement.classList.add('dragging');
                
                const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                document.querySelectorAll('.seat').forEach(el => el.classList.remove('drag-over'));
                
                if (elementBelow && elementBelow.classList.contains('seat') && elementBelow !== currentDragElement) {
                    elementBelow.classList.add('drag-over');
                }
            }
        }

        function handleTouchEnd(e) {
            clearTimeout(dragTimer);
            if (!currentDragElement) return;
            
            lastTouchTime = Date.now(); // タッチが終わった時間を記録
            currentDragElement.classList.remove('dragging');
            document.querySelectorAll('.seat').forEach(el => el.classList.remove('drag-over'));
            
            if (!isMoving) {
                e.preventDefault(); // スマホタップ時は、後続のマウスイベントを完全にキャンセルする
                editSeat(dragStartIndex);
            } else {
                const touch = e.changedTouches[0];
                const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
                if (elementBelow && elementBelow.classList.contains('seat')) {
                    swapSeats(dragStartIndex, elementBelow.dataset.index);
                }
            }
            
            currentDragElement = null;
            dragStartIndex = null;
            isMoving = false;
        }

        // --- ファイル操作・画像化 ---
        function saveData() {
            if (currentSeats.length === 0) return;
            const data = {
                namesText: document.getElementById('namesInput').value,
                rows: document.getElementById('rowsInput').value,
                cols: document.getElementById('colsInput').value,
                seats: currentSeats
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'SmartSeating_Data.json'; a.click();
            URL.revokeObjectURL(url);
        }

        function loadData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    document.getElementById('namesInput').value = data.namesText;
                    document.getElementById('rowsInput').value = data.rows;
                    document.getElementById('colsInput').value = data.cols;
                    numRows = parseInt(data.rows);
                    numCols = parseInt(data.cols);
                    currentSeats = data.seats;
                    renderBoard();
                    document.getElementById('fileInput').value = '';
                } catch (err) { alert("データの読み込みに失敗しました。"); }
            };
            reader.readAsText(file);
        }

        function downloadImage() {
            const captureArea = document.getElementById('capture-area');
            const originalBg = captureArea.style.background;
            captureArea.style.background = getComputedStyle(document.body).getPropertyValue('--container-bg');
            
            html2canvas(captureArea, { scale: 2, backgroundColor: null }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Seating_Chart.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                captureArea.style.background = originalBg;
            });
        }
            </script>                   
</body>
    </html>
